services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lotto
      POSTGRES_USER: lotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotto -d lotto"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      LOTTO_DATABASE_URL: ${LOTTO_DATABASE_URL:?Set LOTTO_DATABASE_URL in .env}
      LOTTO_SCHEDULER_ENABLED: "true"
      LOTTO_LOTTO_POLL_FIRST: ${LOTTO_LOTTO_POLL_FIRST:-14:00}
      LOTTO_LOTTO_POLL_SECOND: ${LOTTO_LOTTO_POLL_SECOND:-22:30}
      LOTTO_MEGA_POLL: ${LOTTO_MEGA_POLL:-19:30}
      LOTTO_POWER_POLL: ${LOTTO_POWER_POLL:-19:30}
      LOTTO_RECONCILE_POLL: ${LOTTO_RECONCILE_POLL:-07:00}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres_data:
